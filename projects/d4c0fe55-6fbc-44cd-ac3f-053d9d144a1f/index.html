<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.05); }
    }
    .fade-up   { animation: fadeUp 0.7s ease both; }
    .delay-1   { animation-delay: 0.15s; }
    .delay-2   { animation-delay: 0.30s; }
    .delay-3   { animation-delay: 0.45s; }
    .orb       { animation: pulse-slow 6s ease-in-out infinite; }
  </style>
  <title>FORGE — Hello!</title>
</head>
<body class="bg-gray-950 text-white min-h-screen overflow-x-hidden">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const capabilities = [
      { icon: "🌐", title: "Web Apps",      desc: "React, Vue, Svelte — beautiful UIs built fast." },
      { icon: "⚙️", title: "APIs & Back-end", desc: "REST APIs, microservices, serverless functions." },
      { icon: "🐍", title: "Python Scripts", desc: "Data pipelines, automation, ML utilities." },
      { icon: "🗄️", title: "Databases",     desc: "SQL schemas, queries, indexes & migrations." },
      { icon: "📦", title: "Full Projects",  desc: "Multi-file repos with configs & READMEs." },
      { icon: "🎨", title: "UI / Design",    desc: "Polished, responsive, animated interfaces." },
    ];

    const App = () => {
      const [input, setInput] = useState("");
      const [submitted, setSubmitted] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (input.trim()) setSubmitted(true);
      };

      return (
        <div className="relative min-h-screen flex flex-col items-center justify-center px-4 py-20">

          {/* Background orbs */}
          <div className="orb fixed top-[-10rem] left-[-10rem] w-[36rem] h-[36rem] rounded-full bg-violet-700 opacity-20 blur-[120px] pointer-events-none" />
          <div className="orb fixed bottom-[-8rem] right-[-8rem] w-[30rem] h-[30rem] rounded-full bg-cyan-500 opacity-20 blur-[100px] pointer-events-none" style={{animationDelay:"3s"}} />

          {/* Badge */}
          <div className="fade-up mb-6 inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-violet-500/40 bg-violet-500/10 text-violet-300 text-sm font-medium">
            <span className="w-2 h-2 rounded-full bg-violet-400 animate-ping inline-block" />
            FORGE is online and ready
          </div>

          {/* Headline */}
          <h1 className="fade-up delay-1 text-5xl sm:text-7xl font-black text-center leading-tight bg-gradient-to-r from-white via-violet-200 to-cyan-300 bg-clip-text text-transparent">
            Hi there! 👋
          </h1>

          <p className="fade-up delay-2 mt-5 text-lg sm:text-xl text-gray-400 text-center max-w-xl">
            I'm <span className="text-white font-semibold">FORGE</span> — your expert AI developer.
            Tell me what you want to build and I'll generate it instantly.
          </p>

          {/* Prompt bar */}
          {!submitted ? (
            <form onSubmit={handleSubmit} className="fade-up delay-3 mt-10 w-full max-w-xl flex gap-2">
              <input
                className="flex-1 bg-gray-900 border border-gray-700 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30 rounded-xl px-5 py-3 text-white placeholder-gray-500 outline-none transition"
                placeholder="e.g. Build me a todo app…"
                value={input}
                onChange={e => setInput(e.target.value)}
              />
              <button
                type="submit"
                className="bg-violet-600 hover:bg-violet-500 active:scale-95 transition-all rounded-xl px-5 py-3 font-semibold text-white shadow-lg shadow-violet-700/30"
              >
                Build →
              </button>
            </form>
          ) : (
            <div className="fade-up mt-10 bg-gray-900 border border-violet-500/40 rounded-2xl px-6 py-4 max-w-xl w-full text-center">
              <p className="text-violet-300 font-medium">✨ Great idea! Type that into the chat and I'll get building.</p>
              <p className="text-gray-500 text-sm mt-1">"{input}"</p>
            </div>
          )}

          {/* Capabilities grid */}
          <div className="fade-up delay-3 mt-20 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-4xl w-full">
            {capabilities.map((c, i) => (
              <div
                key={i}
                className="group bg-gray-900/60 hover:bg-gray-800/80 border border-gray-800 hover:border-violet-500/50 rounded-2xl p-5 transition-all duration-300 cursor-default"
              >
                <div className="text-3xl mb-3">{c.icon}</div>
                <h3 className="font-bold text-white text-lg group-hover:text-violet-300 transition-colors">{c.title}</h3>
                <p className="text-gray-500 text-sm mt-1">{c.desc}</p>
              </div>
            ))}
          </div>

          <p className="mt-16 text-gray-600 text-sm">Just type your idea in the chat to get started.</p>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
